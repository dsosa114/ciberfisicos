controller_manager:
  ros__parameters:

    update_rate: 250 #Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    forward_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    forward_position_controller:
      type: position_controllers/JointGroupPositionController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - waist
      - shoulder
      - elbow
      - wrist_pitch
      - wrist_roll
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 250.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      waist: { trajectory: 0.2, goal: 0.1 }
      shoulder: { trajectory: 0.2, goal: 0.1 }
      elbow: { trajectory: 0.2, goal: 0.1 }
      wrist_pitch: { trajectory: 0.2, goal: 0.1 }
      wrist_roll: { trajectory: 0.2, goal: 0.1 }
      

forward_velocity_controller:
  ros__parameters:
    joints:
      - $(var tf_prefix)waist
      - $(var tf_prefix)shoulder
      - $(var tf_prefix)elbow
      - $(var tf_prefix)wrist_pitch
      - $(var tf_prefix)wrist_roll
    interface_name: velocity

forward_position_controller:
  ros__parameters:
    joints:
      - $(var tf_prefix)waist
      - $(var tf_prefix)shoulder
      - $(var tf_prefix)elbow
      - $(var tf_prefix)wrist_pitch
      - $(var tf_prefix)wrist_roll